<div 
  class="container-grids d-flex align-items-center justify-content-center position-relative"
  style="min-height: 100vh; overflow: hidden;"
>
  <div class="row w-100 justify-content-center">
    <div class="col-8 mt-2 mb-4">
      <mat-card
        class="r d-flex flex-column position-relative"
        style="height: 70vh; overflow: hidden;"
      >
        <div class="card-title">App listas</div>

        <!-- Componente de categorías -->
        <app-categories (categorySelected)="onCategorySelected($event)"></app-categories>

        <div class="row justify-content-center mt-3 flex-grow-1" 
        style="min-height: 0; max-height: 600px; overflow-y: auto; width: 100%;">
   
          <div class="col-9">
            <mat-accordion class="mt-3">
              <div *ngIf="tareasList.length === 0" class="text-center mt-5">
                <mat-icon>keyboard_double_arrow_down</mat-icon>
                <p class="mt-3 text-muted">
                  No hay tareas registradas en esta categoría. ¡Agrega una nueva!
                </p>
              </div>

              <ul class="list-group w-100" style="padding: 12px;">
                <li
                  *ngFor="let tarea of tareasList; let i = index"
                  class="list-group-item d-flex justify-content-between align-items-center py-1"
                  [ngClass]="{
                    'bg-light text-muted': tarea.state === 'completada'
                  }"
                >
                <div class="row w-100 align-items-center">
                  <div class="col-12 col-md-6 d-flex align-items-center">
                    <span class="flex-grow-1 ms-2 fs-6"
                          [class.text-decoration-line-through]="tarea.state === 'completada'">
                      {{ tarea.name }}
                      <span *ngIf="tarea.state == 'completada'">
                        Inicio: {{ tarea.initDate | date:'dd/MM/yyyy' }} - 
                        Final: {{ tarea.endDate | date:'dd/MM/yyyy' }}
                      </span>
                    </span>
                  </div>
                
                  <div class="col-12 col-md-6 d-flex justify-content-end gap-1 mt-2 mt-sm-0">
                    <button mat-icon-button color="accent" (click)="editTarea(i)">
                      <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="accent" (click)="toggleComplete(i)">
                      <mat-icon>{{ tarea.state === 'completada' ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="removeTarea(i)">
                      <mat-icon>delete</mat-icon>
                    </button>
                  </div>
                </div>
                
                </li>
              </ul>
            </mat-accordion>
          </div>
        </div>

        <button
          mat-fab
     
          class="position-absolute bottom-0 end-0 m-3 animate-pulse"
          style="background-color: black; width: 70px; height: 70px; box-shadow: 0 0 15px rgba(33, 34, 36, 0.6);"
          (click)="openDialog()"
        >
          <span style="font-size: 40px">+</span>
        </button>

        
      </mat-card>
    </div>
  </div>
</div>
